JOB_GROUP=gebit-build
JOB_PRODUCT=

JOB_UPSTREAM=[:]
JOB_MAIL_FAILURES=team_dinf@gebit.de
JOB_XVFB=false
JOB_SITE_SEPARATE=false
JOB_MVN_OPTS=-Xmx512M -XX:MaxPermSize=256m 
